<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huddleston Church of God of Prophecy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #312e81;
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--slate-900);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background: #000;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('https://images.unsplash.com/photo-1438032005730-c779502df39b?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 2.5rem;
            padding: 3rem 2rem;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            transition: transform 0.3s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--slate-900);
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--primary);
            font-style: italic;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
            text-align: left;
        }

        .info-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--slate-500);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .info-item p {
            font-size: 1rem;
            color: var(--slate-700);
            font-weight: 500;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: var(--primary-dark);
            color: var(--white);
            padding: 1.25rem 3rem;
            border-radius: 1.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.125rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(199, 210, 254, 0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(199, 210, 254, 0.6);
            background: #2e2a7a;
        }

        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--slate-500);
        }

        @media (max-width: 640px) {
            .hero-card {
                padding: 2.5rem 1.5rem;
                border-radius: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                text-align: center;
            }

            .btn {
                width: 100%;
                padding: 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="container">
        <main class="hero-card">
            <h1>Huddleston Church</h1>
            <p class="subtitle">of God of Prophecy</p>
            
            <div class="info-grid">
                <div class="info-item">
                    <h3>Service Times</h3>
                    <p>Sunday School: 9:45 AM</p>
                    <p>Sunday Worship: 11:00 AM</p>
                    <p>Wednesday Bible Study: 7:00 PM</p>
                </div>
                <div class="info-item">
                    <h3>Location</h3>
                    <p>1022 Winona Lane</p>
                    <p>Lynch Station, VA 24571</p>
                    <p>Bedford County</p>
                </div>
            </div>

            <div class="cta-container">
                <a href="/cogop_stripe/" class="btn">Give Online</a>
                <p class="footer-text">Building a community of faith together.</p>
            </div>
        </main>
    </div>
</body>
</html>
